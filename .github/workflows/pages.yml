name: Deploy Oullin web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            empreendedor-web/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install entrepreneur web dependencies
        working-directory: empreendedor-web
        run: npm ci

      - name: Build entrepreneur web
        working-directory: empreendedor-web
        run: npm run build

      - name: Build Expo web
        working-directory: mobile
        env:
          EXPO_PUBLIC_GEOAPIFY_WEB_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: npm run export:web

      - name: Assemble Pages site
        run: |
          mkdir -p site/cliente
          cp -R mobile/dist/. site/cliente/
          cp -R empreendedor-web/dist/. site/

      - name: Configure Geoapify key
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          if [ -z "$GEOAPIFY_API_KEY" ]; then
            echo "::warning::GEOAPIFY_API_KEY secret is not configured. Address search will be unavailable."
          fi
          node -e "require('node:fs').writeFileSync('site/geoapify-config.js', 'window.OULLIN_GEOAPIFY_API_KEY = ' + JSON.stringify(process.env.GEOAPIFY_API_KEY || '') + ';\\n')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
